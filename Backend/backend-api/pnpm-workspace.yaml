allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@scarf/scarf': true
  '@swc/core': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  sharp: true
  unrs-resolver: true
overrides:
  # 必须与 @nestjs/platform-fastify 精确锁定的版本一致，否则会装上两份 fastify，导致类型增强失效
  "fastify": "5.11.3"
  "html-minifier": "npm:html-minifier-terser@^6.1.0"
  "hono": "^4.11.4"
  "diff": "^8.0.3"
  "picomatch": "^4.0.4"
  "typescript": "$typescript"
onlyBuiltDependencies:
  - '@apollo/protobufjs'
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - '@swc/core'
  - bcrypt
  - esbuild
  - libpq
  - msgpackr-extract
  - nestjs-pino
  - prisma
  - sharp
  - unrs-resolver
